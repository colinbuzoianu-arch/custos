# Copy to config/custos.toml (git-ignored) and adjust.

listen = "127.0.0.1:8787"

# The MCP server Custos protects (streamable HTTP endpoint).
upstream = "http://127.0.0.1:3001/mcp"

# Optional credential Custos sends upstream. Agents never see it.
# upstream_authorization = "Bearer <upstream-token>"

policy_dir = "policies"
audit_log = "data/audit.jsonl"

# How tool-call arguments are recorded in the audit log:
#   "hash"     (default) — store an HMAC-SHA256 of the arguments plus their
#              byte size, never the arguments themselves. Needs a key: set
#              the CUSTOS_AUDIT_KEY environment variable to a hex or base64
#              value of at least 32 bytes (e.g. `openssl rand -hex 32`, or
#              on Windows PowerShell:
#              -join ((1..32) | ForEach-Object { '{0:x2}' -f (Get-Random -Max 256) })
#              ) and set audit_key_id below to label which key that is.
#              The gateway refuses to start if the key is missing or short.
#   "redacted" — keep the JSON shape and keys, replace every value with its
#              type and length, e.g. {"iban": "<string:22>"}. No key needed.
#   "full"     — store arguments as-is. May store personal data; logs a
#              warning at startup. No key needed.
audit_arguments = "hash"

# Which CUSTOS_AUDIT_KEY is loaded, so audit records say what hashed them
# without ever storing the key. Only used when audit_arguments = "hash".
audit_key_id = "2026-01"

# Recorded on every audit entry, so a multi-gateway deployment can tell
# records apart. Defaults to the machine's hostname if left unset.
# instance_id = "gw-eu-1"

# How long an MCP session may sit idle before the gateway forgets it, and
# the most sessions it tracks at once (the least-recently-used one is
# evicted first if this would be exceeded). Defaults shown.
# session_idle_timeout_secs = 86400
# max_sessions = 10000

# How agents authenticate:
#   "static" (default) — a bearer token compared as a SHA-256 hash against
#              [[agents]] below. Never expires; simplest to set up.
#   "signed" — a short-lived, Ed25519-signed token from `custos issue-token`,
#              checked against [[signing_keys]] below. No token_sha256
#              needed on agents in this mode.
auth = "static"

# Only used when auth = "signed". One entry per trusted public key; list
# both the old and new key while rotating. Generate the matching private
# (signing) key the same way as CUSTOS_AUDIT_KEY, e.g. `openssl rand -hex 32`,
# put it in the CUSTOS_SIGNING_KEY environment variable (never in config),
# and get the public key from `custos issue-token`'s own output — or derive
# it from the seed with any Ed25519 tool.
# [[signing_keys]]
# key_id = "2026-01"
# public_key = "REPLACE_WITH_ED25519_PUBLIC_KEY"

# One entry per agent. Create the hash with:
#   cargo run -p custos-gateway -- hash-token <the-agent-token>
[[agents]]
id = "invoice-processor"
owner = "finance-lead"
token_sha256 = "REPLACE_WITH_HASH"

# Optional: sync policy from Custos Control instead of (or alongside)
# hand-edited files in policy_dir. Enroll once first:
#   cargo run -p custos-gateway -- enroll --control https://control.example.com \
#     --token <one-time-token-from-an-admin> --state-path data/control-state.json
# which writes state_path. With no [control] section, the gateway never
# makes an outbound call to Control and behaves exactly as it always has.
# [control]
# url = "https://control.example.com"
# state_path = "data/control-state.json"
# poll_interval_secs = 30
