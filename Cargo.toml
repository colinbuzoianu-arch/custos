[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/colinbuzoianu-arch/custos"
rust-version = "1.88"

[workspace.dependencies]
custos-core = { path = "crates/custos-core" }
custos-policy = { path = "crates/custos-policy" }
custos-audit = { path = "crates/custos-audit" }
custos-inspect = { path = "crates/custos-inspect" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3"
cedar-policy = "4"
miette = "7"
arc-swap = "1"
notify-debouncer-mini = "0.7"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
hostname = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
time = { version = "0.3", features = ["formatting", "serde"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
